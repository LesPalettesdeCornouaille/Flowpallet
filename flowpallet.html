function VueReparateur({ reparations, setReparations, categories, reparateurs }) {
  const [step, setStep] = useState("choix"); // choix | saisie
  const [reparateur, setReparateur] = useState(null);
  const [lignes, setLignes] = useState([{ cat: "", qty: "" }]);
  const [success, setSuccess] = useState(false);
  const today = new Date().toISOString().slice(0, 10);

  function addLigne() {
    if (lignes.length < 7) setLignes(prev => [...prev, { cat: "", qty: "" }]);
  }

  function updateLigne(idx, field, val) {
    setLignes(prev => prev.map((l, i) => i === idx ? { ...l, [field]: val } : l));
  }

  function removeLigne(idx) {
    setLignes(prev => prev.filter((_, i) => i !== idx));
  }

  function handleValider() {
    const valides = lignes.filter(l => l.cat && parseInt(l.qty) > 0);
    if (valides.length === 0) return;
    setReparations(prev => [...prev, {
      id: "rep-" + Date.now(),
      reparateur,
      date: today,
      lignes: valides.map(l => ({ cat: l.cat, qty: parseInt(l.qty) })),
    }]);
    setSuccess(true);
  }

  if (success) return (
    <div style={{ textAlign: "center", padding: 60 }}>
      <div style={{ fontSize: 64, marginBottom: 16 }}>✅</div>
      <h2 style={{ color: "#1e3a5f", marginBottom: 8 }}>Réparations enregistrées !</h2>
      <p style={{ color: "#64748b", marginBottom: 32 }}>Merci {reparateur} !</p>
      <Btn onClick={() => { setSuccess(false); setStep("choix"); setReparateur(null); setLignes([{ cat: "", qty: "" }]); }}>
        Nouvelle saisie
      </Btn>
    </div>
  );

  if (step === "choix") return (
    <div>
      <h2 style={{ color: "#1e3a5f", marginBottom: 6 }}>Qui êtes-vous ?</h2>
      <p style={{ color: "#64748b", marginBottom: 24 }}>Sélectionnez votre nom pour commencer.</p>
      <div style={{ display: "grid", gap: 14 }}>
        {reparateurs.map(nom => (
          <button key={nom} onClick={() => { setReparateur(nom); setStep("saisie"); }} style={{
            background: "#fff", border: "2px solid #e2e8f0", borderRadius: 16,
            padding: "24px", textAlign: "center", cursor: "pointer", fontFamily: "inherit",
          }}>
            <div style={{ fontSize: 36, marginBottom: 8 }}>👤</div>
            <div style={{ fontWeight: 800, fontSize: 20, color: "#1e3a5f" }}>{nom}</div>
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <button onClick={() => setStep("choix")} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", marginBottom: 16, fontSize: 14 }}>← Retour</button>
      <h2 style={{ color: "#1e3a5f", marginBottom: 4 }}>{reparateur}</h2>
      <p style={{ color: "#64748b", marginBottom: 24, fontSize: 14 }}>
        📅 {new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}
      </p>

      <div style={{ display: "grid", gap: 12, marginBottom: 16 }}>
        {lignes.map((ligne, idx) => (
          <div key={idx} style={{ background: "#f8fafc", borderRadius: 12, padding: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#64748b" }}>Ligne {idx + 1}</span>
              {lignes.length > 1 && (
                <button onClick={() => removeLigne(idx)} style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 18 }}>×</button>
              )}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10 }}>
              <div>
                <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: "#64748b", marginBottom: 4, textTransform: "uppercase" }}>Catégorie</label>
                <select value={ligne.cat} onChange={e => updateLigne(idx, "cat", e.target.value)} style={{
                  width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 8,
                  padding: "10px 12px", fontFamily: "inherit", fontSize: 14, color: "#1e3a5f", background: "#fff",
                }}>
                  <option value="">-- Choisir --</option>
                  <optgroup label="── Réparations ──">
                    <option>80x120 Légère</option>
                    <option>80x120 Lourde</option>
                    <option>80x120 Demi-lourde</option>
                    <option>Europe</option>
                    <option>100x120 Légère</option>
                    <option>100x120 Lourde</option>
                    <option>100x120 Demi-lourde</option>
                    <option>Hors normes</option>
                    <option>60x80</option>
                  </optgroup>
                  <optgroup label="── Fabrications ──">
                    <option>Fabrication 60x80</option>
                    <option>Fabrication 40x120</option>
                    <option>Fabrication 92x52</option>
                  </optgroup>
                </select>
              </div>
              <div>
                <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: "#64748b", marginBottom: 4, textTransform: "uppercase" }}>Qté</label>
                <input type="number" min="0" value={ligne.qty}
                  onChange={e => updateLigne(idx, "qty", e.target.value)}
                  placeholder="0"
                  style={{ width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 8, padding: "10px 12px", fontSize: 16, fontFamily: "inherit", textAlign: "center" }}
                />
              </div>
            </div>
          </div>
        ))}
      </div>

      {lignes.length < 7 && (
        <button onClick={addLigne} style={{
          width: "100%", background: "none", border: "2px dashed #e2e8f0",
          borderRadius: 12, padding: "14px", color: "#94a3b8",
          cursor: "pointer", fontFamily: "inherit", fontSize: 14, marginBottom: 16,
        }}>+ Ajouter une ligne</button>
      )}

      <Btn onClick={handleValider} color="#16a34a" style={{ width: "100%" }}>
        ✓ Valider les réparations
      </Btn>
    </div>
  );
}

function VueReparationsDashboard({ reparations }) {
  const now = new Date();
  const [salarie, setSalarie] = useState("tous");
  const [dateDebut, setDateDebut] = useState(null);
  const [dateFin, setDateFin] = useState(null);
  const [moisCal, setMoisCal] = useState(now.getMonth());
  const [anneeCal, setAnneeCal] = useState(now.getFullYear());

  const salaries = [...new Set(reparations.map(r => r.reparateur))].sort();
  const MOIS_NOMS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const JOURS_NOMS = ["L","M","M","J","V","S","D"];

  function getDaysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function getFirstDay(y,m){ return (new Date(y,m,1).getDay()+6)%7; }

  function handleDayClick(dateStr) {
    if (!dateDebut || (dateDebut && dateFin)) {
      setDateDebut(dateStr); setDateFin(null);
    } else {
      if (dateStr < dateDebut) { setDateDebut(dateStr); setDateFin(null); }
      else if (dateStr === dateDebut) { setDateDebut(null); setDateFin(null); }
      else setDateFin(dateStr);
    }
  }

  function isDans(d){ if(!dateDebut) return false; if(!dateFin) return d===dateDebut; return d>=dateDebut&&d<=dateFin; }

  const nbJours = getDaysInMonth(anneeCal, moisCal);
  const premierJour = getFirstDay(anneeCal, moisCal);

  const repsFiltrees = reparations.filter(r => {
    const d = r.date;
    const matchP = !dateDebut ? true : (!dateFin ? d===dateDebut : d>=dateDebut&&d<=dateFin);
    return matchP && (salarie==="tous" || r.reparateur===salarie);
  });

  const totalPalettes = repsFiltrees.reduce((acc,r) =>
    acc + r.lignes.filter(l=>!l.cat.startsWith("Fabrication")).reduce((a,l)=>a+l.qty,0), 0);

  const parCat = {}, parSalarie = {};
  repsFiltrees.forEach(r => r.lignes.filter(l=>!l.cat.startsWith("Fabrication")).forEach(l => {
    parCat[l.cat] = (parCat[l.cat]||0) + l.qty;
    parSalarie[r.reparateur] = (parSalarie[r.reparateur]||0) + l.qty;
  }));

  const joursActifs = new Set(reparations.filter(r=>salarie==="tous"||r.reparateur===salarie).map(r=>r.date));
  const inputStyle = { border:"2px solid #e2e8f0", borderRadius:10, padding:"10px 12px", fontFamily:"inherit", fontSize:14, color:"#1e3a5f", background:"#fff", width:"100%", boxSizing:"border-box" };

  return (
    <div>
      <h2 style={{ color:"#1e3a5f", marginBottom:20 }}>Tableau de bord — Réparations</h2>

      <div style={{ marginBottom:16 }}>
        <label style={{ display:"block", fontSize:11, fontWeight:700, color:"#94a3b8", marginBottom:6, textTransform:"uppercase", letterSpacing:1 }}>Salarié</label>
        <select value={salarie} onChange={e=>setSalarie(e.target.value)} style={inputStyle}>
          <option value="tous">Tous les salariés</option>
          {salaries.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div style={{ background:"#f8fafc", borderRadius:14, padding:14, marginBottom:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <button onClick={()=>{ if(moisCal===0){setMoisCal(11);setAnneeCal(a=>a-1);}else setMoisCal(m=>m-1); }} style={{ background:"none", border:"none", fontSize:22, cursor:"pointer", color:"#1e3a5f", padding:"0 8px" }}>&#8249;</button>
          <span style={{ fontWeight:800, color:"#1e3a5f", fontSize:15 }}>{MOIS_NOMS[moisCal]} {anneeCal}</span>
          <button onClick={()=>{ if(moisCal===11){setMoisCal(0);setAnneeCal(a=>a+1);}else setMoisCal(m=>m+1); }} style={{ background:"none", border:"none", fontSize:22, cursor:"pointer", color:"#1e3a5f", padding:"0 8px" }}>&#8250;</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, marginBottom:4 }}>
          {JOURS_NOMS.map((j,i)=><div key={i} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:"#94a3b8" }}>{j}</div>)}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:3 }}>
          {Array(premierJour).fill(null).map((_,i)=><div key={"e"+i}/>)}
          {Array(nbJours).fill(null).map((_,i)=>{
            const jour = i+1;
            const dateStr = `${anneeCal}-${String(moisCal+1).padStart(2,"0")}-${String(jour).padStart(2,"0")}`;
            const dans = isDans(dateStr);
            const debut = dateStr===dateDebut;
            const fin = dateStr===dateFin;
            const actif = joursActifs.has(dateStr);
            return (
              <button key={jour} onClick={()=>handleDayClick(dateStr)} style={{
                padding:"8px 2px", borderRadius:8, border:"none", cursor:"pointer",
                fontFamily:"inherit", fontWeight:dans?800:400, fontSize:13,
                background:debut||fin?"#1e3a5f":dans?"#dbeafe":"transparent",
                color:debut||fin?"#fff":dans?"#1e3a5f":actif?"#2563eb":"#334155",
                position:"relative",
              }}>
                {jour}
                {actif&&!dans&&<span style={{ position:"absolute", bottom:1, left:"50%", transform:"translateX(-50%)", width:4, height:4, borderRadius:"50%", background:"#2563eb", display:"block" }}/>}
              </button>
            );
          })}
        </div>
        <div style={{ marginTop:10, fontSize:12, color:"#64748b", textAlign:"center" }}>
          {!dateDebut && "Appuyez sur une date pour commencer"}
          {dateDebut&&!dateFin && `${new Date(dateDebut).toLocaleDateString("fr-FR")} — appuyez sur la date de fin`}
          {dateDebut&&dateFin && (
            <span>
              {new Date(dateDebut).toLocaleDateString("fr-FR")} {"->"} {new Date(dateFin).toLocaleDateString("fr-FR")}
              <button onClick={()=>{setDateDebut(null);setDateFin(null);}} style={{ marginLeft:10, background:"none", border:"none", color:"#ef4444", cursor:"pointer", fontSize:13, fontWeight:700 }}>x Reset</button>
            </span>
          )}
        </div>
      </div>

      {dateDebut && (
        <div>
          <div style={{ background:"#1e3a5f", color:"#fff", borderRadius:12, padding:"14px 18px", marginBottom:20, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div>
              <div style={{ fontWeight:800, fontSize:16 }}>{totalPalettes} palette(s)</div>
              <div style={{ fontSize:12, opacity:0.7, marginTop:2 }}>{salarie==="tous"?"Tous salariés":salarie}</div>
            </div>
            <div style={{ fontSize:32 }}>🛠</div>
          </div>
          {repsFiltrees.length===0 ? (
            <div style={{ textAlign:"center", padding:48, color:"#94a3b8" }}>
              <div style={{ fontSize:36, marginBottom:10 }}>📭</div>
              <div style={{ fontWeight:700 }}>Aucune réparation</div>
            </div>
          ) : (
            <div>
              {salarie==="tous" && (
                <div style={{ marginBottom:20 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:"#1e3a5f", textTransform:"uppercase", letterSpacing:1, marginBottom:10 }}>👤 Par salarié</div>
                  {Object.entries(parSalarie).sort((a,b)=>b[1]-a[1]).map(([nom,total])=>(
                    <div key={nom} style={{ background:"#f8fafc", borderRadius:10, padding:"12px 16px", display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                      <span style={{ fontWeight:700, color:"#1e3a5f" }}>{nom}</span>
                      <div style={{ textAlign:"right" }}>
                        <span style={{ background:"#1e3a5f", color:"#fff", borderRadius:8, padding:"3px 12px", fontWeight:800 }}>{total}</span>
                        <div style={{ fontSize:11, color:"#94a3b8", marginTop:2 }}>{totalPalettes>0?((total/totalPalettes)*100).toFixed(0):0}%</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
      <div>
                <div style={{ fontSize:12, fontWeight:700, color:"#1e3a5f", textTransform:"uppercase", letterSpacing:1, marginBottom:10 }}>📦 Par catégorie</div>
                <CategorieDetails parCat={parCat} repsFiltrees={repsFiltrees} totalPalettes={totalPalettes} />
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

      { id: "100x120_LEG_BON", dim: "100x120 Légère",      etat: "Bon état", color: "#22c55e" },
      { id: "100x120_LEG_CAS", dim: "100x120 Légère",      etat: "Cassée",   color: "#ef4444" },
      { id: "80x120_LRD_BON",  dim: "80x120 Lourde",       etat: "Bon état", color: "#22c55e", bonSeulement: true },
      { id: "80x120_LRD_CAS",  dim: "80x120 Lourde",       etat: "Cassée",   color: "#ef4444", bonSeulement: true },
      { id: "80x120_DL_BON",   dim: "80x120 Demi-lourde",  etat: "Bon état", color: "#22c55e" },
      { id: "80x120_DL_CAS",   dim: "80x120 Demi-lourde",  etat: "Cassée",   color: "#ef4444" },
      { id: "80x120_LEG_BON",  dim: "80x120 Légère",       etat: "Bon état", color: "#22c55e" },
      { id: "80x120_LEG_CAS",  dim: "80x120 Légère",       etat: "Cassée",   color: "#ef4444" },
      { id: "60x80_BON",       dim: "60x80",               etat: "Bon état", color: "#22c55e" },
      { id: "60x80_CAS",       dim: "60x80",               etat: "Cassée",   color: "#ef4444" },
      { id: "HN_BON",          dim: "Hors normes",         etat: "Bon état", color: "#22c55e" },
      { id: "HN_CAS",          dim: "Hors normes",         etat: "Cassée",   color: "#ef4444" },
      { id: "FAB_60x80_BON",   dim: "Fabrication 60x80",   etat: "Bon état", color: "#3b82f6", fabricationSeulement: true },
      { id: "FAB_40x120_BON",  dim: "Fabrication 40x120",  etat: "Bon état", color: "#3b82f6", fabricationSeulement: true },
      { id: "FAB_92x52_BON",   dim: "Fabrication 92x52",   etat: "Bon état", color: "#3b82f6", fabricationSeulement: true },
    ];
    // Vérifie si une catégorie requise a un dim ou etat incorrect
    const needsUpdate = CATS_REQUISES.some(req => {
      const existing = categories.find(c => c.id === req.id);
      return !existing || existing.dim !== req.dim || existing.etat !== req.etat;
    });
    if (needsUpdate) {
      const extras = categories.filter(c => !CATS_REQUISES.find(r => r.id === c.id));
      setCategories([...CATS_REQUISES, ...extras]);
    }
  }, []);

  const TABS_COMPTABLE = [
    { id: "bons", label: "Bons", icon: "📋" },
    { id: "rentabilite", label: "Rentabilité", icon: "📊" },
    { id: "reparations", label: "Réparations", icon: "🛠" },
    { id: "rapports", label: "Rapports", icon: "📑" },
    { id: "fournisseurs", label: "Fournisseurs", icon: "🏭" },
    { id: "categories", label: "Catégories", icon: "🗂" },
    { id: "equipe", label: "Équipe", icon: "👥" },
  ];

  if (!role) {
    return (
      <div style={{
        minHeight: "100vh",
        background: "linear-gradient(135deg, #0f2342 0%, #1e3a5f 50%, #163058 100%)",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'Georgia', serif",
      }}>
        <div style={{ textAlign: "center", color: "#fff", padding: 32, width: "100%", maxWidth: 420 }}>
          <div style={{ fontSize: 48, marginBottom: 8 }}>🪵</div>
          <h1 style={{ fontSize: 32, fontWeight: 900, letterSpacing: 2, marginBottom: 4, textTransform: "uppercase" }}>
            Les Palettes de Cornouaille
          </h1>
          <p style={{ color: "#94a3b8", marginBottom: 48, fontSize: 16 }}>Gestion du tri des palettes</p>

          {!showPwd ? (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <button onClick={() => setRole("chauffeur")} style={{
                background: "rgba(255,255,255,0.08)", border: "2px solid rgba(255,255,255,0.15)",
                borderRadius: 16, padding: "24px 12px", color: "#fff", cursor: "pointer", fontFamily: "inherit",
              }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>🚛</div>
                <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Chauffeur</div>
                <div style={{ fontSize: 11, color: "#94a3b8" }}>Saisie enlèvement</div>
              </button>
              <button onClick={() => setRole("reparateur")} style={{
                background: "rgba(255,255,255,0.08)", border: "2px solid rgba(255,255,255,0.15)",
                borderRadius: 16, padding: "24px 12px", color: "#fff", cursor: "pointer", fontFamily: "inherit",
              }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>🛠</div>
                <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Réparateur</div>
                <div style={{ fontSize: 11, color: "#94a3b8" }}>Saisie réparations</div>
              </button>
              <button onClick={() => setRole("trieur")} style={{
                background: "rgba(255,255,255,0.08)", border: "2px solid rgba(255,255,255,0.15)",
                borderRadius: 16, padding: "24px 12px", color: "#fff", cursor: "pointer", fontFamily: "inherit",
              }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>🔧</div>
                <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Trieur</div>
                <div style={{ fontSize: 11, color: "#94a3b8" }}>Tri des palettes</div>
              </button>
              <button onClick={() => { setShowPwd(true); setPwd(""); setPwdError(false); }} style={{
                background: "rgba(255,255,255,0.08)", border: "2px solid rgba(255,255,255,0.15)",
                borderRadius: 16, padding: "24px 12px", color: "#fff", cursor: "pointer", fontFamily: "inherit",
              }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>💼</div>
                <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Comptable</div>
                <div style={{ fontSize: 11, color: "#94a3b8" }}>Gestion & bons</div>
                <div style={{ fontSize: 10, color: "#64748b", marginTop: 6 }}>🔒 Accès sécurisé</div>
              </button>
            </div>
          ) : (
            <div style={{ background: "rgba(255,255,255,0.08)", border: "2px solid rgba(255,255,255,0.15)", borderRadius: 16, padding: 28 }}>
              <div style={{ fontSize: 24, marginBottom: 12 }}>🔒</div>
              <p style={{ color: "#cbd5e1", marginBottom: 20, fontSize: 15 }}>Accès comptable — entrez le mot de passe</p>
              <input
                type="password"
                value={pwd}
                onChange={e => { setPwd(e.target.value); setPwdError(false); }}
                onKeyDown={e => {
                  if (e.key === "Enter") {
                    if (pwd === "admin") { setRole("comptable"); setShowPwd(false); }
                    else setPwdError(true);
                  }
                }}
                placeholder="Mot de passe"
                autoFocus
                style={{
                  width: "100%", boxSizing: "border-box",
                  border: pwdError ? "2px solid #ef4444" : "2px solid rgba(255,255,255,0.2)",
                  borderRadius: 10, padding: "12px 16px",
                  fontSize: 16, fontFamily: "inherit",
                  background: "rgba(255,255,255,0.1)", color: "#fff",
                  outline: "none", marginBottom: 8,
                }}
              />
              {pwdError && <p style={{ color: "#ef4444", fontSize: 13, marginBottom: 12 }}>Mot de passe incorrect</p>}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
                <button onClick={() => setShowPwd(false)} style={{
                  background: "transparent", border: "2px solid rgba(255,255,255,0.2)",
                  borderRadius: 10, padding: "10px", color: "#94a3b8",
                  cursor: "pointer", fontFamily: "inherit", fontSize: 14,
                }}>Annuler</button>
                <button onClick={() => {
                  if (pwd === "admin") { setRole("comptable"); setShowPwd(false); }
                  else setPwdError(true);
                }} style={{
                  background: "#1e3a5f", border: "2px solid #3b82f6",
                  borderRadius: 10, padding: "10px", color: "#fff",
                  cursor: "pointer", fontFamily: "inherit", fontSize: 14, fontWeight: 700,
                }}>Connexion</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#f1f5f9", fontFamily: "'Georgia', serif" }}>
      {/* Header */}
      <div style={{
        background: "linear-gradient(90deg, #0f2342, #1e3a5f)",
        padding: "0 24px",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        boxShadow: "0 2px 12px rgba(0,0,0,0.2)",
        minHeight: 60,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
          <span style={{ fontSize: 18, flexShrink: 0 }}>🪵</span>
          <div style={{ minWidth: 0 }}>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 13, letterSpacing: 1, textTransform: "uppercase", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              Les Palettes de Cornouaille
            </div>
            <div style={{ color: "#94a3b8", fontSize: 11 }}>
              {role === "chauffeur" ? "Chauffeur" : role === "trieur" ? "Trieur" : role === "reparateur" ? "Réparateur" : "Comptable"}
            </div>
          </div>
        </div>
        <button onClick={() => setRole(null)} style={{
          background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)",
          color: "#fff", borderRadius: 8, padding: "6px 14px",
          cursor: "pointer", fontFamily: "inherit", fontSize: 13,
        }}>
          Déconnexion
        </button>
      </div>

      {/* Nav comptable */}
      {role === "comptable" && (
        <div style={{
          background: "#fff", borderBottom: "1px solid #e2e8f0",
          display: "flex", padding: "0 8px", gap: 0, overflowX: "auto",
        }}>
          {TABS_COMPTABLE.map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
              background: "none",
              border: "none",
              borderBottom: activeTab === tab.id ? "3px solid #1e3a5f" : "3px solid transparent",
              padding: "12px 10px",
              cursor: "pointer",
              fontFamily: "inherit",
              fontWeight: activeTab === tab.id ? 800 : 600,
              fontSize: 11,
              color: activeTab === tab.id ? "#1e3a5f" : "#94a3b8",
              whiteSpace: "nowrap",
              flex: 1,
              textAlign: "center",
            }}>
              <div style={{ fontSize: 16, marginBottom: 2 }}>{tab.icon}</div>
              <div>{tab.label}</div>
            </button>
          ))}
        </div>
      )}

      {/* Contenu */}
      <div style={{ maxWidth: 800, margin: "0 auto", padding: 24 }}>
        {role === "chauffeur" && (
          <VueChauffeur
            fournisseurs={fournisseurs}
            setEnlevements={setEnlevements}
            chauffeurs={chauffeurs}
          />
        )}
        {role === "reparateur" && (
          <VueReparateur
            reparations={reparations}
            setReparations={setReparations}
            categories={categories}
            reparateurs={reparateurs}
          />
        )}
        {role === "trieur" && (
          <VueTrieur
            fournisseurs={fournisseurs}
            enlevements={enlevements}
            setEnlevements={setEnlevements}
            categories={categories}
            trieurs={trieurs}
          />
        )}
        {role === "comptable" && activeTab === "bons" && (
          <VueBons
            enlevements={enlevements}
            setEnlevements={setEnlevements}
            fournisseurs={fournisseurs}
            categories={categories}
            prixVenteGlobal={prixVenteGlobal}
            paramsCompta={paramsCompta}
          />
        )}
        {role === "comptable" && activeTab === "rentabilite" && (
          <VueRentabilite
            categories={categories}
            fournisseurs={fournisseurs}
            setFournisseurs={setFournisseurs}
            prixVenteGlobal={prixVenteGlobal}
            setPrixVenteGlobal={setPrixVenteGlobal}
            paramsCompta={paramsCompta}
            setParamsCompta={setParamsCompta}
          />
        )}
        {role === "comptable" && activeTab === "rapports" && (
          <VueRapports enlevements={enlevements} fournisseurs={fournisseurs} categories={categories} />
        )}
        {role === "comptable" && activeTab === "reparations" && (
          <VueReparationsDashboard reparations={reparations} categories={categories} />
        )}
        {role === "comptable" && activeTab === "fournisseurs" && (
          <VueFournisseurs
            fournisseurs={fournisseurs}
            setFournisseurs={setFournisseurs}
            categories={categories}
            setCategories={setCategories}
          />
        )}
        {role === "comptable" && activeTab === "equipe" && (
          <VueEquipe
            chauffeurs={chauffeurs} saveChauffeurs={saveChauffeurs}
            trieurs={trieurs} saveTrieurs={saveTrieurs}
            reparateurs={reparateurs} saveReparateurs={saveReparateurs}
          />
        )}
        {role === "comptable" && activeTab === "categories" && (
          <VueCategories categories={categories} setCategories={setCategories} />
        )}
      </div>
    </div>
  );
}

// Render app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
