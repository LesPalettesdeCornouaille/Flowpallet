function calcRentabilite(enlevement, fournisseur, categories) {
  const qties = enlevement.quantitesValidees || enlevement.quantitesTri || {};
  let ca = 0;
  Object.entries(qties).forEach(([catId, qty]) => {
    const tarif = fournisseur.tarifs[catId] || 0;
    ca += qty * tarif;
  });
  const couts = (enlevement.coutTransport || 0) + (enlevement.coutTri || 0) + (enlevement.coutReparation || 0);
  const marge = ca > 0 ? ((ca - couts) / ca) * 100 : 0;
  return { ca, couts, marge };
}

function applyIA(quantitesTri, fournisseur) {
  const result = {};
  const bases = [...new Set(
    Object.keys(quantitesTri).map(k => k.replace(/_BON$/, "").replace(/_CAS$/, ""))
  )];
  bases.forEach(base => {
    const bon = quantitesTri[`${base}_BON`] || 0;
    const cas = quantitesTri[`${base}_CAS`] || 0;
    const taux = (fournisseur?.tauxCasse || 20) / 100;
    // 20% des Bon état passent en Cassées
    const transfert = Math.round(bon * taux);
    result[`${base}_BON`] = bon - transfert;
    result[`${base}_CAS`] = cas + transfert;
  });
  return result;
}

function formatDate(d) {
  if (!d) return "";
  const [y, m, j] = d.split("-");
  return `${j}/${m}/${y}`;
}

function genBonId() {
  return "BON-" + Date.now().toString().slice(-6);
}

// VUE ÉQUIPE (comptable)
// ============================================================
function VueEquipe({ chauffeurs, saveChauffeurs, trieurs, saveTrieurs, reparateurs, saveReparateurs }) {
  const [nouveauChauffeur, setNouveauChauffeur] = useState("");
  const [nouveauTrieur, setNouveauTrieur] = useState("");
  const [nouveauReparateur, setNouveauReparateur] = useState("");

  function ajouterChauffeur() {
    const nom = nouveauChauffeur.trim();
    if (!nom || chauffeurs.includes(nom)) return;
    saveChauffeurs([...chauffeurs, nom]);
    setNouveauChauffeur("");
  }

  function supprimerChauffeur(nom) {
    saveChauffeurs(chauffeurs.filter(n => n !== nom));
  }

  function ajouterTrieur() {
    const nom = nouveauTrieur.trim();
    if (!nom || trieurs.includes(nom)) return;
    saveTrieurs([...trieurs, nom]);
    setNouveauTrieur("");
  }

  function supprimerTrieur(nom) {
    saveTrieurs(trieurs.filter(n => n !== nom));
  }

  function ajouterReparateur() {
    const nom = nouveauReparateur.trim();
    if (!nom || reparateurs.includes(nom)) return;
    saveReparateurs([...reparateurs, nom]);
    setNouveauReparateur("");
  }

  function supprimerReparateur(nom) {
    saveReparateurs(reparateurs.filter(n => n !== nom));
  }

  function Section({ title, icon, liste, nouveau, setNouveau, onAjouter, onSupprimer }) {
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: "#1e3a5f", marginBottom: 12 }}>{icon} {title}</div>
        <div style={{ display: "grid", gap: 8, marginBottom: 12 }}>
          {liste.map(nom => (
            <div key={nom} style={{ background: "#f8fafc", borderRadius: 10, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#1e3a5f" }}>{nom}</span>
              <button onClick={() => onSupprimer(nom)} style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 18, fontWeight: 700 }}>×</button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input type="text" value={nouveau} onChange={e => setNouveau(e.target.value)}
            onKeyDown={e => e.key === "Enter" && onAjouter()}
            placeholder="Prénom..."
            style={{ flex: 1, border: "2px solid #e2e8f0", borderRadius: 8, padding: "10px 14px", fontSize: 15, fontFamily: "inherit" }}
          />
          <Btn onClick={onAjouter}>+ Ajouter</Btn>
        </div>
      </div>
    );
  }

  return (
    <div>
      <h2 style={{ color: "#1e3a5f", marginBottom: 20 }}>Gestion de l'équipe</h2>
      <Section title="Chauffeurs" icon="🚛" liste={chauffeurs}
        nouveau={nouveauChauffeur} setNouveau={setNouveauChauffeur}
        onAjouter={ajouterChauffeur} onSupprimer={supprimerChauffeur} />
      <Section title="Trieurs" icon="🔧" liste={trieurs}
        nouveau={nouveauTrieur} setNouveau={setNouveauTrieur}
        onAjouter={ajouterTrieur} onSupprimer={supprimerTrieur} />
      <Section title="Réparateurs" icon="🛠" liste={reparateurs}
        nouveau={nouveauReparateur} setNouveau={setNouveauReparateur}
        onAjouter={ajouterReparateur} onSupprimer={supprimerReparateur} />
    </div>
  );
}

  function handleSelectF(f) {
    setSelectedF(f.id);
    setDate(new Date().toISOString().slice(0, 10));
    setTravee(""); setNote("");
    setStep("saisie");
  }

  function handleSave() {
    setEnlevements(prev => [...prev, {
      id: "enl-" + Date.now(),
      fournisseurId: selectedF,
      date, travee, note,
      nomChauffeur,
      quantitesApprox: {},
      statut: "chauffeur",

            onChange={e => setTravee("Autre: " + e.target.value)}
            placeholder="Précisez l'emplacement..."
            style={{ width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 10, padding: "11px 14px", fontSize: 15, fontFamily: "inherit" }}
          />
        )}
      </div>
      <Textarea label="Note / Commentaire" value={note} onChange={setNote} rows={3} />
      <Btn onClick={handleSave} style={{ width: "100%", marginTop: 8 }}>✓ Enregistrer l'enlèvement</Btn>
    </div>
  );
}

// ============================================================
// SAISIE VOCALE TRIEUR
// ============================================================
function VocalTri({ catsTrieur, setTriQties }) {
  const [ecoute, setEcoute] = useState(false);
  const [transcription, setTranscription] = useState("");
  const [feedback, setFeedback] = useState("");
  const recognitionRef = useRef(null);

  // Correspondances vocales → catégories
  const MOTS_CATS = [
    // Europe
    { mots: ["europe bon état", "europe bonne état", "europe bon", "europe bonne"], id: "EUR_BON" },
    { mots: ["europe cassée", "europe cassé", "europe casser"], id: "EUR_CAS" },
    // 100x120 Lourde
    { mots: ["cent cent vingt lourde bon état", "cent cent vingt lourde bon", "cent vingt lourde bon état", "100 120 lourde bon"], id: "100x120_LRD_BON" },
    { mots: ["cent cent vingt lourde cassée", "cent cent vingt lourde cassé", "cent vingt lourde cassé", "100 120 lourde cassé"], id: "100x120_LRD_CAS" },
    // 100x120 Demi-lourde
    { mots: ["cent cent vingt demi bon état", "cent cent vingt demi bon", "cent vingt demi bon", "100 120 demi bon"], id: "100x120_DL_BON" },
    { mots: ["cent cent vingt demi cassée", "cent cent vingt demi cassé", "cent vingt demi cassé", "100 120 demi cassé"], id: "100x120_DL_CAS" },
    // 100x120 Légère
    { mots: ["cent cent vingt légère bon état", "cent cent vingt légère bon", "cent vingt légère bon", "100 120 légère bon"], id: "100x120_LEG_BON" },
    { mots: ["cent cent vingt légère cassée", "cent cent vingt légère cassé", "cent vingt légère cassé", "100 120 légère cassé"], id: "100x120_LEG_CAS" },
    // 80x120 Lourde
    { mots: ["quatre vingt cent vingt lourde bon état", "quatre vingt cent vingt lourde bon", "80 120 lourde bon", "quatre-vingt cent vingt lourde bon"], id: "80x120_LRD_BON" },
    { mots: ["quatre vingt cent vingt lourde cassée", "quatre vingt cent vingt lourde cassé", "80 120 lourde cassé", "quatre-vingt cent vingt lourde cassé"], id: "80x120_LRD_CAS" },
    // 80x120 Demi-lourde
    { mots: ["quatre vingt cent vingt demi bon état", "quatre vingt cent vingt demi bon", "80 120 demi bon", "quatre-vingt cent vingt demi bon"], id: "80x120_DL_BON" },
    { mots: ["quatre vingt cent vingt demi cassée", "quatre vingt cent vingt demi cassé", "80 120 demi cassé"], id: "80x120_DL_CAS" },
    // 80x120 Légère
    { mots: ["quatre vingt cent vingt légère bon état", "quatre vingt cent vingt légère bon", "80 120 légère bon", "quatre-vingt cent vingt légère bon"], id: "80x120_LEG_BON" },
    { mots: ["quatre vingt cent vingt légère cassée", "quatre vingt cent vingt légère cassé", "80 120 légère cassé"], id: "80x120_LEG_CAS" },
    // 60x80
    { mots: ["soixante quatre vingt bon état", "soixante quatre vingt bon", "60 80 bon", "soixante-quatre-vingt bon"], id: "60x80_BON" },
    { mots: ["soixante quatre vingt cassée", "soixante quatre vingt cassé", "60 80 cassé", "soixante-quatre-vingt cassé"], id: "60x80_CAS" },
    // Hors normes
    { mots: ["hors norme bon état", "hors normes bon", "hors cote bon", "hors côte bon"], id: "HN_BON" },
    { mots: ["hors norme cassée", "hors normes cassé", "hors cote cassé", "hors côte cassé"], id: "HN_CAS" },
    // 100x120 Lourde (bonSeulement)
    { mots: ["cent cent vingt lourde bon état", "100 120 lourde lourd bon"], id: "100x120_LRD_BON" },
    { mots: ["quatre vingt cent vingt lourde bon état"], id: "80x120_LRD_BON" },
  ];

  function parserVoix(texte) {
    const t = texte.toLowerCase()
      .replace(/é/g,"e").replace(/è/g,"e").replace(/ê/g,"e")
      .replace(/cassée/g,"cassé").replace(/bonne état/g,"bon état");
    // Cherche un nombre dans le texte
    const mots = ["un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
      "onze","douze","treize","quatorze","quinze","seize","vingt","trente","quarante","cinquante"];
    const nbMot = mots.findIndex(m => t.includes(m));
    const nbChiffre = t.match(/\b(\d+)\b/);
    let quantite = null;
    if (nbChiffre) quantite = parseInt(nbChiffre[1]);
    else if (nbMot >= 0) quantite = nbMot + 1;
    if (!quantite) return null;

    // Cherche la catégorie — d'abord les plus longues pour éviter les faux positifs
    const tousLesMots = MOTS_CATS.flatMap(cat => cat.mots.map(m => ({ m, id: cat.id })));
    tousLesMots.sort((a, b) => b.m.length - a.m.length);
    for (const { m, id } of tousLesMots) {
      if (t.includes(m.replace(/é/g,"e").replace(/è/g,"e"))) {
        return { catId: id, quantite };
      }
    }
    return { quantite, catId: null };
  }

  function demarrerEcoute() {
    if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
      setFeedback("❌ Reconnaissance vocale non supportée sur ce navigateur");
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SR();
    recognition.lang = "fr-FR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognitionRef.current = recognition;

    recognition.onstart = () => { setEcoute(true); setFeedback("🎤 J'écoute..."); };
    recognition.onend = () => setEcoute(false);
    recognition.onerror = () => { setEcoute(false); setFeedback("❌ Erreur micro"); };
    recognition.onresult = e => {
      const texte = e.results[0][0].transcript;
      setTranscription(texte);
      const resultat = parserVoix(texte);
      if (resultat?.catId && resultat.quantite) {
        setTriQties(prev => ({ ...prev, [resultat.catId]: resultat.quantite }));
        const cat = catsTrieur.find(c => c.id === resultat.catId);
        setFeedback(`✅ ${cat?.dim || resultat.catId} : ${resultat.quantite}`);
      } else if (resultat?.quantite && !resultat.catId) {
        setFeedback(`⚠️ Catégorie non reconnue — "${texte}"`);
      } else {
        setFeedback(`⚠️ Non compris — "${texte}"`);
      }
      setTimeout(() => setFeedback(""), 3000);
    };
    recognition.start();
  }

  function arreterEcoute() {
    recognitionRef.current?.stop();
    setEcoute(false);
  }

  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
        <button
          onClick={ecoute ? arreterEcoute : demarrerEcoute}
          style={{
            background: ecoute ? "#ef4444" : "#1e3a5f",
            color: "#fff", border: "none", borderRadius: 12,
            padding: "12px 20px", fontFamily: "inherit", fontWeight: 700, fontSize: 14,
            cursor: "pointer", display: "flex", alignItems: "center", gap: 8,
            boxShadow: ecoute ? "0 0 0 4px rgba(239,68,68,0.3)" : "none",
            animation: ecoute ? "pulse 1s infinite" : "none",
          }}
        >
          <span style={{ fontSize: 20 }}>{ecoute ? "⏹" : "🎤"}</span>
          {ecoute ? "Arrêter" : "Saisie vocale"}
        </button>
        {feedback && (
          <div style={{ fontSize: 13, fontWeight: 600, color: feedback.startsWith("✅") ? "#16a34a" : feedback.startsWith("❌") ? "#ef4444" : "#f59e0b" }}>
            {feedback}
          </div>
        )}
      </div>
      {transcription && (
        <div style={{ fontSize: 12, color: "#94a3b8", fontStyle: "italic" }}>
          Entendu : "{transcription}"
        </div>
      )}
      <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>
        Dites le nom complet : <em>"Europe bon état douze"</em>, <em>"Europe cassée treize"</em>, <em>"soixante quatre vingt bon état trois"</em>
      </div>
    </div>
  );
}

// ============================================================
// VUE TRIEUR
// ============================================================
function VueTrieur({ fournisseurs, enlevements, setEnlevements, categories, trieurs }) {
  const [step, setStep] = useState("choix");
  const [nomTrieur, setNomTrieur] = useState(null);
  const [currentEnl, setCurrentEnl] = useState(null);
  const [triQties, setTriQties] = useState({});
  const [commentaireTri, setCommentaireTri] = useState("");
  const [preValide, setPreValide] = useState(false);
  const [preValideSuccess, setPreValideSuccess] = useState(false);
  const [success, setSuccess] = useState(false);

  const aTraiter = enlevements.filter(e => e.statut === "chauffeur" || e.statut === "preValide");
  const fournisseur = fournisseurs.find(f => f.id === currentEnl?.fournisseurId);

  function handleSelectEnl(enl) {
    setCurrentEnl(enl);
    if (enl.statut === "preValide") {
      setTriQties(enl.quantitesTri || {});
      setCommentaireTri(enl.commentaireTri || "");
      setPreValide(true);
    } else {
      setTriQties({});
      setCommentaireTri("");
      setPreValide(false);
    }
    setStep("tri");
  }

  function updateTri(catId, val) {
    setTriQties(prev => ({ ...prev, [catId]: parseInt(val) || 0 }));
  }

  function handlePreValider() {
    setEnlevements(prev => prev.map(e => e.id === currentEnl.id
      ? { ...e, statut: "preValide", quantitesTri: triQties, commentaireTri }
      : e
    ));
    setPreValide(true);
    setCurrentEnl(prev => ({ ...prev, statut: "preValide", quantitesTri: triQties, commentaireTri }));
    setPreValideSuccess(true);
    setTimeout(() => setPreValideSuccess(false), 3000);
  }

  function handleValiderTri() {
    const f = fournisseurs.find(f => f.id === currentEnl.fournisseurId);
    const ia = applyIA(triQties, f);
    const dateTri = new Date().toISOString().slice(0, 10);
    setEnlevements(prev => prev.map(e => e.id === currentEnl.id
      ? { ...e, statut: "trie", quantitesTri: triQties, quantitesIA: ia, commentaireTri, afficherCommentaire: true, dateTri, nomTrieur }
      : e
    ));
    setSuccess(true);
  }

  if (success) {
    return (
      <div style={{ textAlign: "center", padding: 60 }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>✅</div>
        <h2 style={{ color: "#1e3a5f", marginBottom: 8 }}>Tri validé !</h2>
        <p style={{ color: "#64748b", marginBottom: 32 }}>Le bon d'enlèvement sera généré par le comptable.</p>
        <Btn onClick={() => { setSuccess(false); setStep("choix"); setCurrentEnl(null); setPreValide(false); setNomTrieur(null); }}>Retour à l'accueil</Btn>
      </div>
    );
  }

  // ÉCRAN CHOIX DU TRIEUR
  if (step === "choix") return (
    <div>
      <h2 style={{ color: "#1e3a5f", marginBottom: 6 }}>Qui êtes-vous ?</h2>
      <p style={{ color: "#64748b", marginBottom: 24 }}>Sélectionnez votre nom pour commencer.</p>
      <div style={{ display: "grid", gap: 14 }}>
        {trieurs.map(nom => (
          <button key={nom} onClick={() => { setNomTrieur(nom); setStep("liste"); }} style={{
            background: "#fff", border: "2px solid #e2e8f0", borderRadius: 16,
            padding: "24px", textAlign: "center", cursor: "pointer", fontFamily: "inherit",
          }}>
            <div style={{ fontSize: 36, marginBottom: 8 }}>👤</div>
            <div style={{ fontWeight: 800, fontSize: 20, color: "#1e3a5f" }}>{nom}</div>
          </button>
        ))}
      </div>
    </div>
  );

  // Exclut les catégories "bon seulement" et filtre selon les catégories actives du fournisseur
  const catsActives = fournisseur?.categoriesActives || categories.map(c => c.id);
  const catsTrieur = categories.filter(c => !c.bonSeulement && !c.fabricationSeulement && catsActives.includes(c.id));
  const dims = [...new Set(catsTrieur.map(c => c.dim))];

  return (
    <>
      {/* Popup confirmation pré-validation */}
      {preValideSuccess && (
        <div style={{
          position: "fixed", bottom: 32, left: "50%", transform: "translateX(-50%)",
          background: "#f59e0b", color: "#fff",
          borderRadius: 16, padding: "16px 28px",
          boxShadow: "0 8px 32px rgba(0,0,0,0.2)",
          display: "flex", alignItems: "center", gap: 12,
          zIndex: 2000, fontSize: 15, fontWeight: 700,
          minWidth: 280,
        }}>
          <span style={{ fontSize: 22 }}>✓</span>
          Pré-validation mise à jour !
        </div>
      )}

      {/* PAGE LISTE */}
      {step === "liste" && (
        <div>
          <div style={{ background: "#1e3a5f", color: "#fff", borderRadius: 14, padding: "16px 20px", marginBottom: 24, textAlign: "center" }}>
            <div style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", opacity: 0.6, marginBottom: 4 }}>En attente de tri</div>
            <div style={{ fontSize: 18, fontWeight: 900, letterSpacing: 1 }}>FOURNISSEURS DE PALETTES À TRIER</div>
            <div style={{ fontSize: 13, opacity: 0.7, marginTop: 4 }}>{nomTrieur} — {aTraiter.length} enlèvement(s) en attente</div>
          </div>
          {aTraiter.length === 0 ? (
            <div style={{ textAlign: "center", padding: 60, color: "#94a3b8" }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>🎉</div>
              <div style={{ fontWeight: 700, fontSize: 16 }}>Aucune palette en attente de tri !</div>
            </div>
          ) : (
            <div style={{ display: "grid", gap: 12 }}>
              {aTraiter.map(enl => {
                const f = fournisseurs.find(f => f.id === enl.fournisseurId);
                const isPre = enl.statut === "preValide";
                return (
                  <button key={enl.id} onClick={() => handleSelectEnl(enl)} style={{
                    background: "#fff",
                    border: `2px solid ${isPre ? "#22c55e" : "#fbbf24"}`,
                    borderRadius: 14, padding: "18px 24px",
                    textAlign: "left", cursor: "pointer", fontFamily: "inherit",
                    boxShadow: isPre ? "0 2px 12px rgba(34,197,94,0.15)" : "0 2px 12px rgba(251,191,36,0.15)",
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontWeight: 800, fontSize: 17, color: "#1e3a5f" }}>{f?.raisonSociale}</div>
                        <div style={{ fontSize: 13, color: "#64748b", marginTop: 3 }}>Enlevé le {formatDate(enl.date)}</div>
                        {enl.travee && <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 2 }}>Travée : {enl.travee}</div>}
                        {enl.note && <div style={{ fontSize: 12, color: "#f59e0b", marginTop: 2, fontStyle: "italic" }}>📝 {enl.note}</div>}
                        {isPre && <div style={{ fontSize: 12, color: "#16a34a", marginTop: 4, fontWeight: 700 }}>✓ Pré-validé — modifiable</div>}
                      </div>
                      <div style={{ background: isPre ? "#22c55e" : "#fbbf24", color: "#fff", borderRadius: 10, padding: "8px 14px", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap" }}>
                        {isPre ? "Modifier →" : "Trier →"}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* PAGE TRI */}
      {step === "tri" && (
        <div>
          <button onClick={() => setStep("liste")} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", marginBottom: 16, fontSize: 14 }}>← Retour</button>
          <h2 style={{ color: "#1e3a5f", marginBottom: 4 }}>{fournisseur?.raisonSociale}</h2>
          <p style={{ color: "#64748b", marginBottom: 6 }}>Enlèvement du {formatDate(currentEnl?.date)}</p>
          <p style={{ color: "#2563eb", fontSize: 13, marginBottom: 6 }}>🔧 Date du tri : {new Date().toLocaleDateString("fr-FR")}</p>
          {preValide && (
            <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 8, padding: "8px 14px", marginBottom: 16, fontSize: 13, color: "#16a34a", fontWeight: 600 }}>
              ✓ Feuille pré-validée — vous pouvez encore modifier les quantités
            </div>
          )}

          {/* BOUTON MICRO */}
          <VocalTri catsTrieur={catsTrieur} setTriQties={setTriQties} />

          <p style={{ color: "#94a3b8", fontSize: 13, marginBottom: 16 }}>Saisissez les quantités triées. Appuyez sur <strong>Entrée</strong> pour passer au champ suivant.</p>

          {(() => {
            // Liste ordonnée de tous les inputs pour le focus automatique
            const allCats = dims.flatMap(dim => catsTrieur.filter(c => c.dim === dim));
            const inputRefs = {};
            return (
              <>
                {dims.map(dim => (
                  <div key={dim} style={{ marginBottom: 16, background: "#f8fafc", borderRadius: 12, padding: 16 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: "#1e3a5f", marginBottom: 12 }}>{dim}</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, width: "100%" }}>
                      {catsTrieur.filter(c => c.dim === dim).map(cat => {
                        const idx = allCats.findIndex(c => c.id === cat.id);
                        return (
                          <div key={cat.id} style={{ minWidth: 0 }}>
                            <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: cat.etat === "Bon état" ? "#16a34a" : "#dc2626", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.5 }}>
                              {cat.etat}
                            </label>
                            <input
                              ref={el => { if (el) inputRefs[cat.id] = el; }}
                              type="number" min="0"
                              value={triQties[cat.id] || ""}
                              onChange={e => updateTri(cat.id, e.target.value)}
                              onKeyDown={e => {
                                if (e.key === "Enter") {
                                  e.preventDefault();
                                  const nextCat = allCats[idx + 1];
                                  if (nextCat && inputRefs[nextCat.id]) {
                                    inputRefs[nextCat.id].focus();
                                    inputRefs[nextCat.id].select();
                                  }
                                }
                              }}
                              placeholder="0"
                              style={{
                                width: "100%", boxSizing: "border-box",
                                border: `2px solid ${cat.etat === "Bon état" ? "#bbf7d0" : "#fecaca"}`,
                                borderRadius: 8, padding: "8px 12px",
                                fontSize: 16, textAlign: "center", fontFamily: "inherit",
                              }}
                            />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </>
            );
          })()}
          <div style={{ marginTop: 16, marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 6, letterSpacing: 1, textTransform: "uppercase" }}>Commentaire sur le tri</label>
            <textarea
              value={commentaireTri}
              onChange={e => setCommentaireTri(e.target.value)}
              placeholder="Ex : palettes humides, plusieurs palettes abîmées sur les bords..."
              rows={3}
              style={{ width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 8, padding: "9px 12px", fontSize: 14, fontFamily: "inherit", outline: "none", resize: "vertical" }}
            />
          </div>
          <Btn onClick={handlePreValider} outline color="#f59e0b" style={{ width: "100%", marginBottom: 10 }}>
            {preValide ? "↺ Mettre à jour la pré-validation" : "⏸ Pré-valider (modifiable)"}
          </Btn>
          {preValide && (
            <Btn onClick={handleValiderTri} color="#16a34a" style={{ width: "100%" }}>
              ✓ Valider définitivement
            </Btn>
          )}
        </div>
      )}
    </>
  );
}

    "100x120_DL_CAS": prix ou 0,
    "100x120_LEG_BON": prix ou 0,
    "100x120_LEG_CAS": prix ou 0,
    "80x120_LRD_BON": prix ou 0,
    "80x120_LRD_CAS": prix ou 0,
    "80x120_DL_BON": prix ou 0,
    "80x120_DL_CAS": prix ou 0,
    "80x120_LEG_BON": prix ou 0,
    "80x120_LEG_CAS": prix ou 0,
    "60x80_BON": prix ou 0,
    "60x80_CAS": prix ou 0,
    "HN_BON": prix ou 0,
    "HN_CAS": prix ou 0
  },
  "autresDimensions": [
    { "dim": "dimension exacte ex: 90x140", "prixBon": prix ou 0, "prixCas": prix ou 0 }
  ]
}
Pour "autresDimensions", liste toutes les dimensions présentes sur le bon qui ne correspondent pas aux catégories standard ci-dessus.
Réponds UNIQUEMENT avec le JSON brut, aucun texte avant ou après.` }
            ]
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.[0]?.text || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setIaResult(parsed);
    } catch(err) {
      setIaError("❌ Erreur d'analyse : " + err.message);
    }
    setIaLoading(false);
  }

  function openAdd() {
    setForm({
      raisonSociale: "", adresse: "", emailCompta: "",
      emailType: "Bonjour,\n\nVeuillez trouver ci-joint le(s) bon(s) d'enlèvement correspondant à notre passage dans vos locaux.\n\nMerci de transmettre la facture à l'email suivant : pierre.guidou@sfr.fr\n\nCordialement,\nL'équipe Les Palettes de Cornouaille",
      tarifs: {}, tauxCasse: 20, categoriesActives: defaultCatsActives,
    });
    setEditing(null);
    setModal("edit");
  }

  function openEdit(f) {
    setForm({ ...f, categoriesActives: f.categoriesActives || defaultCatsActives });
    setEditing(f.id);
    setModal("edit");
  }

  function handleSave() {
    if (editing) {
      setFournisseurs(prev => prev.map(f => f.id === editing ? { ...form, id: editing } : f));
    } else {
      setFournisseurs(prev => [...prev, { ...form, id: "f-" + Date.now() }]);
    }
    setModal(null);
  }

  function handleDelete(id) {
    if (confirm("Supprimer ce fournisseur ?")) {
      setFournisseurs(prev => prev.filter(f => f.id !== id));
    }
  }

  function updateTarif(catId, val) {
    setForm(prev => ({ ...prev, tarifs: { ...prev.tarifs, [catId]: parseFloat(val) || 0 } }));
  }

  function toggleCat(catId) {
    setForm(prev => {
      const actives = prev.categoriesActives || defaultCatsActives;
      return {
        ...prev,
        categoriesActives: actives.includes(catId)
          ? actives.filter(id => id !== catId)
          : [...actives, catId],
      };
    });
  }

  const dims = [...new Set(categories.filter(c => !c.fabricationSeulement).map(c => c.dim))];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <div>
          <h2 style={{ margin: 0, color: "#1e3a5f" }}>Fiches fournisseurs</h2>
          <p style={{ margin: "4px 0 0", color: "#94a3b8", fontSize: 14 }}>{fournisseurs.length} fournisseur(s) enregistré(s)</p>
        </div>
        <div style={{ display: "flex", gap: 8, flexDirection: "column" }}>
          <button onClick={() => setModal("ia")} style={{
            background: "#7c3aed", color: "#fff", border: "none", borderRadius: 12,
            padding: "12px 16px", fontFamily: "inherit", fontWeight: 700, fontSize: 13,
            cursor: "pointer", textAlign: "center",
          }}>📄 Ajouter un fournisseur via un bon d'enlèvement ou un devis</button>
          <button onClick={openAdd} style={{
            background: "#1e3a5f", color: "#fff", border: "none", borderRadius: 12,
            padding: "12px 16px", fontFamily: "inherit", fontWeight: 700, fontSize: 13,
            cursor: "pointer", textAlign: "center",
          }}>➕ Ajouter un fournisseur manuellement</button>
        </div>
      </div>

      <div style={{ display: "grid", gap: 14 }}>
        {fournisseurs.map(f => (
          <Card key={f.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: 17, color: "#1e3a5f" }}>{f.raisonSociale}</div>
                <div style={{ fontSize: 13, color: "#64748b", marginTop: 2 }}>{f.adresse}</div>
                <div style={{ fontSize: 13, color: "#3b82f6", marginTop: 2 }}>✉ {f.emailCompta}</div>
                <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 2 }}>
                  {(f.categoriesActives || defaultCatsActives).length} catégorie(s) active(s)
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn small outline onClick={() => openEdit(f)}>Modifier</Btn>
                <Btn small color="#ef4444" outline onClick={() => handleDelete(f.id)}>Supprimer</Btn>
              </div>
            </div>
          </Card>
        ))}
      </div>

      {/* MODAL CRÉATION VIA BON D'ENLÈVEMENT IA */}
      {modal === "ia" && (
        <Modal title="📄 Créer un fournisseur via un bon d'enlèvement" onClose={() => { setModal(null); setIaResult(null); setIaLoading(false); setIaError(null); }} wide>
          <p style={{ color: "#64748b", fontSize: 14, marginBottom: 16 }}>
            Prenez en photo ou importez un bon d'enlèvement existant. L'IA va extraire automatiquement le nom, l'adresse, les catégories et les tarifs.
          </p>
          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 8, textTransform: "uppercase" }}>
              Photo du bon d'enlèvement
            </label>
            <input type="file" accept="image/*,application/pdf"
              onChange={e => setIaFile(e.target.files[0])}
              style={{ width: "100%", padding: "10px", border: "2px dashed #e2e8f0", borderRadius: 10, fontFamily: "inherit" }}
            />
          </div>
          {iaFile && !iaResult && (
            <Btn onClick={analyserBonIA} color="#7c3aed" style={{ width: "100%", marginBottom: 12 }}>
              {iaLoading ? "⏳ Analyse en cours..." : "🤖 Analyser avec l'IA"}
            </Btn>
          )}
          {iaError && <div style={{ color: "#ef4444", fontSize: 13, marginBottom: 12 }}>{iaError}</div>}
          {iaResult && (
            <div>
              <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 10, padding: 14, marginBottom: 16 }}>
                <div style={{ fontWeight: 700, color: "#16a34a", marginBottom: 8 }}>✅ Fournisseur détecté :</div>
                <div style={{ fontSize: 14, color: "#334155" }}><strong>{iaResult.raisonSociale}</strong></div>
                <div style={{ fontSize: 13, color: "#64748b" }}>{iaResult.adresse}{iaResult.codePostal ? `, ${iaResult.codePostal}` : ""}{iaResult.ville ? ` ${iaResult.ville}` : ""}</div>
                {iaResult.telephone && <div style={{ fontSize: 13, color: "#64748b" }}>📞 {iaResult.telephone}</div>}
                {iaResult.emailCompta && <div style={{ fontSize: 13, color: "#3b82f6" }}>✉ {iaResult.emailCompta}</div>}
                <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 8 }}>
                  {Object.values(iaResult.tarifs || {}).filter(v => v > 0).length} tarif(s) standard détecté(s)
                  {iaResult.autresDimensions?.length > 0 && ` + ${iaResult.autresDimensions.length} dimension(s) supplémentaire(s)`}
                </div>
                {iaResult.autresDimensions?.length > 0 && (
                  <div style={{ marginTop: 8, background: "#f8fafc", borderRadius: 8, padding: "8px 12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#1e3a5f", marginBottom: 4 }}>📦 Dimensions supplémentaires détectées :</div>
                    {iaResult.autresDimensions.map((d, i) => (
                      <div key={i} style={{ fontSize: 12, color: "#334155" }}>• {d.dim} — BON: {d.prixBon}€ / CAS: {d.prixCas}€</div>
                    ))}
                    <div style={{ fontSize: 11, color: "#64748b", marginTop: 4 }}>Seront créées automatiquement dans les catégories.</div>
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <Btn outline onClick={() => { setIaResult(null); setIaFile(null); }}>Réessayer</Btn>
                <Btn onClick={() => {
                  // Crée les nouvelles catégories si besoin
                  if (iaResult.autresDimensions?.length > 0) {
                    const nouvelles = [];
                    iaResult.autresDimensions.forEach(d => {
                      const idBon = d.dim.replace(/[^a-zA-Z0-9]/g, "_") + "_BON";
                      const idCas = d.dim.replace(/[^a-zA-Z0-9]/g, "_") + "_CAS";
                      if (!categories.find(c => c.id === idBon)) {
                        nouvelles.push({ id: idBon, dim: d.dim, etat: "Bon état", color: "#22c55e", custom: true });
                        nouvelles.push({ id: idCas, dim: d.dim, etat: "Cassée",   color: "#ef4444", custom: true });
                      }
                    });
                    if (nouvelles.length > 0) setCategories(prev => [...prev, ...nouvelles]);
                  }
                  // Construit les tarifs avec les nouvelles dims
                  const tarifsComplets = { ...iaResult.tarifs };
                  iaResult.autresDimensions?.forEach(d => {
                    const idBon = d.dim.replace(/[^a-zA-Z0-9]/g, "_") + "_BON";
                    const idCas = d.dim.replace(/[^a-zA-Z0-9]/g, "_") + "_CAS";
                    if (d.prixBon) tarifsComplets[idBon] = d.prixBon;
                    if (d.prixCas) tarifsComplets[idCas] = d.prixCas;
                  });
                  const adresseComplete = [iaResult.adresse, iaResult.codePostal, iaResult.ville].filter(Boolean).join(" ");
                  setFournisseurs(prev => [...prev, {
                    ...iaResult,
                    adresse: adresseComplete,
                    tarifs: tarifsComplets,
                    id: "f-" + Date.now(),
                    tauxCasse: 20,
                    emailType: "Bonjour,\n\nVeuillez trouver ci-joint le(s) bon(s) d'enlèvement correspondant à notre passage dans vos locaux.\n\nMerci de transmettre la facture à l'email suivant : pierre.guidou@sfr.fr\n\nCordialement,\nL'équipe Les Palettes de Cornouaille",
                    categoriesActives: defaultCatsActives,
                  }]);
                  setModal(null); setIaResult(null); setIaFile(null);
                }} color="#16a34a">✓ Créer ce fournisseur</Btn>
              </div>
            </div>
          )}
        </Modal>
      )}

      {modal === "edit" && (
        <Modal title={editing ? "Modifier le fournisseur" : "Nouveau fournisseur"} onClose={() => setModal(null)} wide>
          <Input label="Raison sociale" value={form.raisonSociale} onChange={v => setForm(p => ({ ...p, raisonSociale: v }))} />
          <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({ ...p, adresse: v }))} />
          <Input label="Email comptabilité" type="email" value={form.emailCompta} onChange={v => setForm(p => ({ ...p, emailCompta: v }))} />
          <Textarea label="Email type (corps du message)" value={form.emailType} onChange={v => setForm(p => ({ ...p, emailType: v }))} rows={5} />

          {/* CATÉGORIES & TARIFS — fusionnés */}
          <div style={{ marginBottom: 20 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 4, letterSpacing: 1, textTransform: "uppercase" }}>
              Catégories actives & tarifs d'achat
            </label>
            <p style={{ fontSize: 12, color: "#94a3b8", marginBottom: 12 }}>
              Cochez les catégories actives — le tarif d'achat apparaît immédiatement.
            </p>
            {dims.map(dim => (
              <div key={dim} style={{ marginBottom: 12, background: "#f8fafc", borderRadius: 10, padding: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 13, color: "#1e3a5f", marginBottom: 10 }}>{dim}</div>
                <div style={{ display: "grid", gap: 8 }}>
                  {categories.filter(c => c.dim === dim && !c.fabricationSeulement).map(cat => {
                    const active = (form.categoriesActives || defaultCatsActives).includes(cat.id);
                    const couleur = cat.etat === "Bon état" ? "#16a34a" : "#dc2626";
                    const bg = cat.etat === "Bon état" ? "#f0fdf4" : "#fef2f2";
                    const border = cat.etat === "Bon état" ? "#bbf7d0" : "#fecaca";
                    return (
                      <div key={cat.id} style={{ borderRadius: 8, border: `2px solid ${active ? border : "#e2e8f0"}`, background: active ? bg : "#fff", overflow: "hidden" }}>
                        {/* Case à cocher */}
                        <label style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", cursor: "pointer" }}>
                          <input type="checkbox" checked={active} onChange={() => toggleCat(cat.id)}
                            style={{ width: 18, height: 18, cursor: "pointer", accentColor: couleur }} />
                          <span style={{ fontSize: 14, fontWeight: 700, color: active ? couleur : "#94a3b8" }}>
                            {cat.etat}
                          </span>
                          {!active && <span style={{ fontSize: 11, color: "#94a3b8", marginLeft: "auto" }}>Inactif</span>}
                        </label>
                        {/* Tarif — visible seulement si actif */}
                        {active && (
                          <div style={{ padding: "0 12px 12px", borderTop: `1px solid ${border}` }}>
                            <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: "#64748b", margin: "8px 0 4px", textTransform: "uppercase" }}>
                              Tarif d'achat (€/palette)
                            </label>
                            <input
                              type="number" min="0" step="0.01"
                              value={form.tarifs[cat.id] || ""}
                              onChange={e => updateTarif(cat.id, e.target.value)}
                              placeholder="0,00"
                              style={{ width: "100%", boxSizing: "border-box", border: `2px solid ${border}`, borderRadius: 8, padding: "8px 12px", fontSize: 15, fontFamily: "inherit" }}
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={() => setModal(null)}>Annuler</Btn>
            <Btn onClick={handleSave}>Enregistrer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// HISTORIQUE PAR ANNÉE / MOIS

function HistoriqueView({ tousLesEnls, fournisseurs, categories, prixVenteGlobal, paramsCompta }) {
  const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const ANNEES = [2026,2027,2028,2029,2030];
  const now = new Date();
  const [annee, setAnnee] = useState(now.getFullYear());
  const [mois, setMois] = useState(now.getMonth());
  const [detailEnl, setDetailEnl] = useState(null);

  const moisStr = `${annee}-${String(mois + 1).padStart(2, "0")}`;
  const bonsDuMois = tousLesEnls.filter(e => {
    if (!e.date) return false;
    const d = new Date(e.date);
    return d.getFullYear() === annee && d.getMonth() === mois;
  });
  const aEnvoyerMois = bonsDuMois.filter(e => !e.bonEnvoye);
  const envoyesMois = bonsDuMois.filter(e => e.bonEnvoye);

  function getStatutBadge(enl) {
    if (enl.bonEnvoye) return null;
    if (enl.statut === "valide") return <Badge color="#2563eb">Validé</Badge>;
    return <Badge color="#f59e0b">À valider</Badge>;
  }

  const selectStyle = {
    width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 10,
    padding: "12px 14px", fontFamily: "inherit", fontSize: 15, fontWeight: 700, color: "#1e3a5f", background: "#fff", outline: "none",
  };

  function BonCardHisto({ enl }) {
    const f = fournisseurs.find(f => f.id === enl.fournisseurId);
    return (
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 15, color: "#1e3a5f" }}>{f?.raisonSociale}</div>
            <div style={{ fontSize: 13, color: "#64748b" }}>Enlèvement du {formatDate(enl.date)}</div>
            {enl.dateTri && <div style={{ fontSize: 12, color: "#2563eb", marginTop: 2 }}>🔧 Trié le {formatDate(enl.dateTri)}</div>}
            {enl.bonEnvoye && enl.dateEnvoi && <div style={{ fontSize: 12, color: "#7c3aed", marginTop: 2 }}>✉ Envoyé le {formatDate(enl.dateEnvoi)}</div>}
            {enl.note && <div style={{ fontSize: 12, color: "#f59e0b", marginTop: 2, fontStyle: "italic" }}>📝 {enl.note}</div>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {getStatutBadge(enl)}
            <Btn small outline onClick={() => setDetailEnl(enl)}>Détail</Btn>
          </div>
        </div>
      </Card>
    );
  }

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
        <div>
          <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: "#94a3b8", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>Année</label>
          <select value={annee} onChange={e => setAnnee(parseInt(e.target.value))} style={selectStyle}>
            {ANNEES.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div>
          <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: "#94a3b8", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>Mois</label>
          <select value={mois} onChange={e => setMois(parseInt(e.target.value))} style={selectStyle}>
            {MOIS.map((nom, idx) => <option key={idx} value={idx}>{nom}</option>)}
          </select>
        </div>
      </div>

      <div style={{ background: "#1e3a5f", color: "#fff", borderRadius: 12, padding: "12px 16px", marginBottom: 16, display: "flex", justifyContent: "space-between" }}>
        <span style={{ fontWeight: 700 }}>{MOIS[mois]} {annee}</span>
        <span style={{ opacity: 0.75, fontSize: 13 }}>{bonsDuMois.length} bon(s)</span>
      </div>

      {bonsDuMois.length === 0 ? (
        <div style={{ textAlign: "center", padding: 48, color: "#94a3b8" }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>📭</div>
          <div style={{ fontWeight: 700 }}>Aucun bon ce mois-ci</div>
        </div>
      ) : (
        <div>
          {aEnvoyerMois.length > 0 && (
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#f59e0b", textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>📤 À envoyer — {aEnvoyerMois.length}</div>
              <div style={{ display: "grid", gap: 10 }}>
                {aEnvoyerMois.map(enl => <BonCardHisto key={enl.id} enl={enl} />)}
              </div>
            </div>
          )}
          {envoyesMois.length > 0 && (
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#7c3aed", textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>✅ Envoyés — {envoyesMois.length}</div>
              <div style={{ display: "grid", gap: 10 }}>
                {envoyesMois.map(enl => <BonCardHisto key={enl.id} enl={enl} />)}
              </div>
            </div>
          )}
        </div>
      )}

      {detailEnl && (
        <Modal title={`Bon — ${fournisseurs.find(f => f.id === detailEnl.fournisseurId)?.raisonSociale}`} onClose={() => setDetailEnl(null)} wide>
          <BonDetail enl={detailEnl} fournisseur={fournisseurs.find(f => f.id === detailEnl.fournisseurId)} categories={categories} prixVenteGlobal={prixVenteGlobal} paramsCompta={paramsCompta} />
        </Modal>
      )}
    </div>
  );
}

function VueBons({ enlevements, setEnlevements, fournisseurs, categories, prixVenteGlobal, paramsCompta }) {
  const [onglet, setOnglet] = useState("aEnvoyer");
  const [selectedBons, setSelectedBons] = useState([]);
  const [detailEnl, setDetailEnl] = useState(null);
  const [search, setSearch] = useState("");
  const [emailModal, setEmailModal] = useState(null);
  const [emailsEnMasse, setEmailsEnMasse] = useState(null);
  const [emailSuccess, setEmailSuccess] = useState(null);

  const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const ANNEES = [2026,2027,2028,2029,2030];

  const tousLesEnls = enlevements.filter(e =>
    e.statut === "trie" || e.statut === "valide" || e.statut === "preValide" || e.bonEnvoye
  );
  const aEnvoyer = tousLesEnls.filter(e => !e.bonEnvoye);

  function filtreSearch(liste) {
    if (!search.trim()) return liste;
    const q = search.toLowerCase();
    return liste.filter(e => {
      const f = fournisseurs.find(f => f.id === e.fournisseurId);
      return f?.raisonSociale.toLowerCase().includes(q) || formatDate(e.date).includes(q);
    });
  }

  function toggleSelect(id) {
    setSelectedBons(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function handleValiderBon(enl) {
    setEnlevements(prev => prev.map(e => e.id === enl.id ? {
      ...e, statut: "valide",
      quantitesValidees: enl.quantitesTri,
    } : e));
  }

  function grouperParFournisseur(ids) {
    const bons = enlevements.filter(e => ids.includes(e.id));
    const groupes = {};
    bons.forEach(b => {
      if (!groupes[b.fournisseurId]) groupes[b.fournisseurId] = [];
      groupes[b.fournisseurId].push(b);
    });
    return Object.entries(groupes).map(([fId, bons]) => ({
      fournisseur: fournisseurs.find(f => f.id === fId),
      bons,
    }));
  }

  function handleEnvoyerSelection() {
    const groupes = grouperParFournisseur(selectedBons);
    if (groupes.length === 1) {
      setEmailModal({ fournisseur: groupes[0].fournisseur, bons: groupes[0].bons, ids: selectedBons });
    } else {
      setEmailsEnMasse({ groupes, ids: selectedBons });
    }
  }

  function handleToutEnvoyer() {
    const ids = aEnvoyer.map(e => e.id);
    const groupes = grouperParFournisseur(ids);
    setEmailsEnMasse({ groupes, ids });
  }

  function handleConfirmEmail() {
    const ids = emailModal.ids || selectedBons;
    setEnlevements(prev => prev.map(e => ids.includes(e.id) ? { ...e, bonEnvoye: true, dateEnvoi: new Date().toISOString().slice(0, 10) } : e));
    const info = { fournisseur: emailModal.fournisseur, nb: emailModal.bons.length };
    setSelectedBons([]); setEmailModal(null);
    setEmailSuccess(info); setTimeout(() => setEmailSuccess(null), 4000);
  }

  function handleConfirmEnMasse() {
    const ids = emailsEnMasse.ids;
    setEnlevements(prev => prev.map(e => ids.includes(e.id) ? { ...e, bonEnvoye: true, dateEnvoi: new Date().toISOString().slice(0, 10) } : e));

  function getStatutBadge(enl) {
    if (enl.bonEnvoye) return null;

    return <Badge color="#f59e0b">À valider</Badge>;

  return (

      <h2 style={{ margin: "0 0 16px", color: "#1e3a5f" }}>Bons d'enlèvement</h2>

      {/* ONGLETS */}
      <div style={{ display: "flex", marginBottom: 20, borderRadius: 12, overflow: "hidden", border: "2px solid #e2e8f0" }}>
        {[
          { key: "aEnvoyer", label: "📤 À envoyer", count: aEnvoyer.length },
          { key: "historique", label: "📅 Historique", count: tousLesEnls.length },
        ].map(tab => (
          <button key={tab.key} onClick={() => { setOnglet(tab.key); setSelectedBons([]); setSearch(""); }} style={{
            flex: 1, padding: "12px 16px", background: onglet === tab.key ? "#1e3a5f" : "#fff",
            color: onglet === tab.key ? "#fff" : "#64748b", border: "none", cursor: "pointer",

            <span style={{ marginLeft: 8, background: onglet === tab.key ? "rgba(255,255,255,0.25)" : "#e2e8f0", color: onglet === tab.key ? "#fff" : "#64748b", borderRadius: 20, padding: "1px 8px", fontSize: 12 }}>{tab.count}</span>

      </div>

      {/* BARRE RECHERCHE */}
      <div style={{ position: "relative", marginBottom: 16 }}>
        <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", fontSize: 16, color: "#94a3b8" }}>🔍</span>
        <input type="text" value={search} onChange={e => setSearch(e.target.value)}

          style={{ width: "100%", boxSizing: "border-box", border: "2px solid #e2e8f0", borderRadius: 10, padding: "11px 12px 11px 38px", fontSize: 14, fontFamily: "inherit", outline: "none" }}
        />
      </div>

      {/* ONGLET À ENVOYER */}
      {onglet === "aEnvoyer" && (
        <div>
          {aEnvoyer.length > 0 && (
            <button onClick={handleToutEnvoyer} style={{
              width: "100%", background: "linear-gradient(135deg, #7c3aed, #6d28d9)", color: "#fff",
              border: "none", borderRadius: 14, padding: "16px 24px", fontFamily: "inherit",
              fontWeight: 800, fontSize: 16, cursor: "pointer", marginBottom: 16,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              boxShadow: "0 4px 20px rgba(124,58,237,0.3)",
            }}>
              <span style={{ fontSize: 20 }}>✉</span>
              Tout envoyer — {aEnvoyer.length} bon(s) / {[...new Set(aEnvoyer.map(e => e.fournisseurId))].length} fournisseur(s)
            </button>
          )}
          {selectedBons.length > 0 && (
            <div style={{ marginBottom: 16, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <Btn onClick={handleEnvoyerSelection} color="#7c3aed">✉ Envoyer {selectedBons.length} sélectionné(s)</Btn>
              <Btn small outline onClick={() => setSelectedBons([])}>Désélectionner</Btn>
            </div>
          )}
          <div style={{ display: "grid", gap: 14 }}>
            {filtreSearch(aEnvoyer).map(enl => {

              const isSelected = selectedBons.includes(enl.id);
              return (
                <Card key={enl.id} style={{ border: isSelected ? "2px solid #2563eb" : "2px solid transparent" }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                    <input type="checkbox" checked={isSelected} onChange={() => toggleSelect(enl.id)}
                      style={{ marginTop: 4, width: 18, height: 18, cursor: "pointer" }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
                        <div>
                          <div style={{ fontWeight: 800, fontSize: 16, color: "#1e3a5f" }}>{f?.raisonSociale}</div>
                          <div style={{ fontSize: 13, color: "#64748b" }}>Enlèvement du {formatDate(enl.date)}</div>

                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

              );

            {filtreSearch(aEnvoyer).length === 0 && (
              <div style={{ textAlign: "center", padding: 60, color: "#94a3b8" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>🎉</div>
                <div style={{ fontWeight: 700 }}>{search ? "Aucun résultat." : "Aucun bon à envoyer !"}</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ONGLET HISTORIQUE */}
      {onglet === "historique" && (
        <HistoriqueView tousLesEnls={tousLesEnls} fournisseurs={fournisseurs} categories={categories} prixVenteGlobal={prixVenteGlobal} paramsCompta={paramsCompta} />
      )}

      {/* MODALS */}
      {detailEnl && (
        <Modal title={`Bon — ${fournisseurs.find(f => f.id === detailEnl.fournisseurId)?.raisonSociale}`} onClose={() => setDetailEnl(null)} wide>
          <BonDetail enl={detailEnl} fournisseur={fournisseurs.find(f => f.id === detailEnl.fournisseurId)} categories={categories} prixVenteGlobal={prixVenteGlobal} paramsCompta={paramsCompta} />
        </Modal>
      )}

      {emailModal && (
        <Modal title="Envoyer par email" onClose={() => setEmailModal(null)}>
          <div style={{ marginBottom: 16 }}>
            <p style={{ color: "#64748b", fontSize: 14 }}>Destinataire : <strong>{emailModal.fournisseur.emailCompta}</strong></p>
            <div style={{ background: "#f0f7ff", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 13 }}>
              <span style={{ fontWeight: 700, color: "#1e3a5f" }}>Objet : </span>
              <span>{`Bon d'enlèvement ${emailModal.bons.map(b => formatDate(b.date)).join(", ")} // Les Palettes de Cornouaille`}</span>
            </div>
            <ul style={{ color: "#334155", fontSize: 14, margin: "8px 0 16px 20px" }}>
              {emailModal.bons.map(b => <li key={b.id}>Enlèvement du {formatDate(b.date)}{b.note ? ` — ${b.note}` : ""}</li>)}
            </ul>
            <div style={{ background: "#f8fafc", borderRadius: 10, padding: 16, fontSize: 13, color: "#475569", whiteSpace: "pre-wrap" }}>{emailModal.fournisseur.emailType}</div>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={() => setEmailModal(null)}>Annuler</Btn>
            <Btn color="#7c3aed" onClick={handleConfirmEmail}>✉ Confirmer</Btn>
          </div>
        </Modal>
      )}

      {emailsEnMasse && (
        <Modal title="Envoyer tous les bons" onClose={() => setEmailsEnMasse(null)}>
          <div style={{ marginBottom: 16 }}>
            <p style={{ color: "#64748b", fontSize: 14, marginBottom: 12 }}>
              {emailsEnMasse.ids.length} bon(s) → <strong>{emailsEnMasse.groupes.length} email(s)</strong> groupés par fournisseur :
            </p>
            {emailsEnMasse.groupes.map(({ fournisseur: f, bons }) => (
              <div key={f?.id} style={{ background: "#f8fafc", borderRadius: 10, padding: 12, marginBottom: 10 }}>
                <div style={{ fontWeight: 700, color: "#1e3a5f", marginBottom: 4 }}>📧 {f?.raisonSociale}</div>
                <div style={{ fontSize: 12, color: "#64748b", marginBottom: 4 }}>→ {f?.emailCompta}</div>
                <div style={{ fontSize: 12, color: "#334155", fontStyle: "italic", marginBottom: 4 }}>
                  Objet : {`Bon d'enlèvement ${bons.map(b => formatDate(b.date)).join(", ")} // Les Palettes de Cornouaille`}
                </div>
                <ul style={{ margin: "4px 0 0 16px", fontSize: 12, color: "#64748b" }}>
                  {bons.map(b => <li key={b.id}>Enlèvement du {formatDate(b.date)}</li>)}

          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn outline onClick={() => setEmailsEnMasse(null)}>Annuler</Btn>
            <Btn color="#7c3aed" onClick={handleConfirmEnMasse}>✉ Tout confirmer</Btn>
          </div>
        </Modal>

      {emailSuccess && (
        <div style={{
          position: "fixed", bottom: 32, left: "50%", transform: "translateX(-50%)",
          background: "#16a34a", color: "#fff", borderRadius: 16, padding: "18px 32px",
          boxShadow: "0 8px 32px rgba(0,0,0,0.2)", display: "flex", alignItems: "center", gap: 14,
          zIndex: 2000, fontSize: 15, fontWeight: 700, minWidth: 320,
        }}>
          <span style={{ fontSize: 28 }}>✅</span>
          <div>
            <div>Email(s) envoyé(s) !</div>
            <div style={{ fontWeight: 400, fontSize: 13, opacity: 0.85, marginTop: 2 }}>{emailSuccess.nb} bon(s) → {emailSuccess.fournisseur.emailCompta}</div>

    </div>
  );
}


function DetailValidation({ enl, onValider }) {

    <div style={{ marginTop: 16, borderTop: "1px solid #e2e8f0", paddingTop: 16 }}>
      <Btn onClick={onValider} color="#16a34a">✓ Valider ce bon</Btn>
    </div>
  );
}

function BonDetail({ enl, fournisseur, categories, prixVenteGlobal, paramsCompta }) {
  const qties = enl.quantitesValidees || enl.quantitesTri || {};
  const catsActives = fournisseur?.categoriesActives || categories.map(c => c.id);
  const catsAffichees = categories.filter(c => catsActives.includes(c.id) && !c.fabricationSeulement);
  const [cibleRentab, setCibleRentab] = useState(null);
  const [deductionPct, setDeductionPct] = useState(null);

  // pv et calcRentab définis AVANT useMemo
  const pv = prixVenteGlobal || {};

  function calcRentab(q) {
    let ca = 0, achat = 0;
    catsAffichees.forEach(c => {
      const qty = q[c.id] || 0;
      const idBon = c.id.replace("_CAS", "_BON");
      const pvCat = pv[idBon] || pv[c.id] || 0;
      ca += qty * pvCat;
      achat += qty * (fournisseur?.tarifs?.[c.id] || 0);
    });
    const marge = ca - achat;
    const taux = ca > 0 ? (marge / ca * 100) : 0;
    return { ca, achat, marge, taux };
  }

  const RECLASSEMENTS = [
    ...catsAffichees.filter(c => c.etat === "Bon état" && catsAffichees.find(x => x.id === c.id.replace("_BON","_CAS")))
      .map(c => [c.id, c.id.replace("_BON","_CAS")]),
    ["100x120_LRD_BON","100x120_DL_BON"], ["80x120_LRD_BON","80x120_DL_BON"],
    ["100x120_DL_BON","100x120_LEG_BON"], ["80x120_DL_BON","80x120_LEG_BON"],
    ["EUR_BON","80x120_LRD_BON"], ["EUR_BON","HN_BON"],
    ["100x120_LRD_BON","HN_BON"], ["80x120_LRD_BON","HN_BON"],
  ];

  // Calcule le bon optimisé selon les sélections actives
  const { qOptim, modifs } = useMemo(() => {
    if (!cibleRentab && !deductionPct) return { qOptim: null, modifs: [] };
    let q = { ...qties };
    const modifs = [];

    if (cibleRentab && calcRentab(q).taux < cibleRentab) {
      // Toutes les options de reclassement avec plafond 50%
      const optionsBonEnCas = catsAffichees
        .filter(c => c.etat === "Bon état" && catsAffichees.find(x => x.id === c.id.replace("_BON","_CAS")))
        .map(c => {
          const idCas = c.id.replace("_BON","_CAS");
          const gainAchat = (fournisseur?.tarifs?.[c.id] || 0) - (fournisseur?.tarifs?.[idCas] || 0);
          const qteBon = qties[c.id] || 0;
          const qteCas = qties[idCas] || 0;
          const total = qteBon + qteCas;
          // Max cassées = 50% du total → on peut passer au max (total/2 - qteCas déjà) en cassé
          const maxCasseesPossible = Math.floor(total * 0.5);
          const maxReclassable = Math.max(0, maxCasseesPossible - qteCas);
          return { src: c.id, dst: idCas, label: `${c.dim} Bon état → ${c.dim} Cassée`, gainAchat, max: maxReclassable };
        })
        .filter(o => o.max > 0 && o.gainAchat > 0)
        .sort((a, b) => b.gainAchat - a.gainAchat);

      const optionsAutres = [
        // Lourde → Demi-lourde (Bon état), max 50%
        { src:"100x120_LRD_BON", dst:"100x120_DL_BON",  label:"100x120 Lourde → 100x120 Demi-lourde", gainAchat:(fournisseur?.tarifs?.["100x120_LRD_BON"]||0)-(fournisseur?.tarifs?.["100x120_DL_BON"]||0), max: Math.floor((qties["100x120_LRD_BON"]||0)*0.5) },
        { src:"80x120_LRD_BON",  dst:"80x120_DL_BON",   label:"80x120 Lourde → 80x120 Demi-lourde",   gainAchat:(fournisseur?.tarifs?.["80x120_LRD_BON"]||0)-(fournisseur?.tarifs?.["80x120_DL_BON"]||0),  max: Math.floor((qties["80x120_LRD_BON"]||0)*0.5) },
        // Lourde → Demi-lourde (Cassée), max 50%
        { src:"100x120_LRD_CAS", dst:"100x120_DL_CAS",  label:"100x120 Lourde Cassée → 100x120 DL Cassée", gainAchat:(fournisseur?.tarifs?.["100x120_LRD_CAS"]||0)-(fournisseur?.tarifs?.["100x120_DL_CAS"]||0), max: Math.floor((qties["100x120_LRD_CAS"]||0)*0.5) },
        { src:"80x120_LRD_CAS",  dst:"80x120_DL_CAS",   label:"80x120 Lourde Cassée → 80x120 DL Cassée",   gainAchat:(fournisseur?.tarifs?.["80x120_LRD_CAS"]||0)-(fournisseur?.tarifs?.["80x120_DL_CAS"]||0),  max: Math.floor((qties["80x120_LRD_CAS"]||0)*0.5) },
        // DL → Légère (Bon état), max 50%
        { src:"100x120_DL_BON",  dst:"100x120_LEG_BON", label:"100x120 DL → 100x120 Légère",           gainAchat:(fournisseur?.tarifs?.["100x120_DL_BON"]||0)-(fournisseur?.tarifs?.["100x120_LEG_BON"]||0), max: Math.floor((qties["100x120_DL_BON"]||0)*0.5) },
        { src:"80x120_DL_BON",   dst:"80x120_LEG_BON",  label:"80x120 DL → 80x120 Légère",             gainAchat:(fournisseur?.tarifs?.["80x120_DL_BON"]||0)-(fournisseur?.tarifs?.["80x120_LEG_BON"]||0),   max: Math.floor((qties["80x120_DL_BON"]||0)*0.5) },
        // → Hors cotes (dernier recours), max 50%
        { src:"EUR_BON",         dst:"HN_BON",           label:"Europe → Hors cotes",                   gainAchat:(fournisseur?.tarifs?.["EUR_BON"]||0)-(fournisseur?.tarifs?.["HN_BON"]||0),         max: Math.floor((qties["EUR_BON"]||0)*0.5) },
        { src:"100x120_LRD_BON", dst:"HN_BON",           label:"100x120 Lourde → Hors cotes",           gainAchat:(fournisseur?.tarifs?.["100x120_LRD_BON"]||0)-(fournisseur?.tarifs?.["HN_BON"]||0), max: Math.floor((qties["100x120_LRD_BON"]||0)*0.5) },
        { src:"80x120_LRD_BON",  dst:"HN_BON",           label:"80x120 Lourde → Hors cotes",            gainAchat:(fournisseur?.tarifs?.["80x120_LRD_BON"]||0)-(fournisseur?.tarifs?.["HN_BON"]||0),  max: Math.floor((qties["80x120_LRD_BON"]||0)*0.5) },
      ];

      // Fusion avec optionsBonEnCas et tri par gainAchat décroissant
      const optionsTriees = [...optionsBonEnCas, ...optionsAutres]
        .filter(o => o.max > 0 && (qties[o.src] || 0) > 0)
        .sort((a, b) => b.gainAchat - a.gainAchat);

      const compteur = {};
      let progression = true;
      while (progression && calcRentab(q).taux < cibleRentab) {
        progression = false;
        for (const opt of optionsTriees) {
          if (calcRentab(q).taux >= cibleRentab) break;
          const fait = compteur[opt.src+opt.dst] || 0;
          if (fait >= opt.max) continue;
          if ((q[opt.src] || 0) <= 0) continue;
          q = { ...q, [opt.src]: (q[opt.src]||0)-1, [opt.dst]: (q[opt.dst]||0)+1 };
          compteur[opt.src+opt.dst] = fait + 1;
          modifs.push(opt.label);
          progression = true;
        }
      }
    }

    // 2. Déduction des palettes les plus chères
    if (deductionPct) {
      const palettes = [];
      catsAffichees.forEach(cat => {
        const qty = q[cat.id] || 0;
        const tarif = fournisseur?.tarifs?.[cat.id] || 0;
        for (let i = 0; i < qty; i++) palettes.push({ id: cat.id, tarif, dim: cat.dim, etat: cat.etat });
      });
      palettes.sort((a, b) => b.tarif - a.tarif);
      const nRetirer = Math.round(palettes.length * deductionPct / 100);
      for (let i = 0; i < nRetirer; i++) {
        if (!palettes[i]) break;
        q = { ...q, [palettes[i].id]: Math.max(0, (q[palettes[i].id]||0)-1) };
        modifs.push(`Déduite : ${palettes[i].dim} ${palettes[i].etat} (${palettes[i].tarif.toFixed(2)}€)`);
      }
    }

    return { qOptim: q, modifs };
  }, [cibleRentab, deductionPct, qties]);

  const rentabOptim = qOptim ? calcRentab(qOptim) : null;

  // Résumé groupé des modifs
  const modifGroupees = modifs.reduce((acc, m) => {
    acc[m] = (acc[m] || 0) + 1;
    return acc;
  }, {});

  const actionLabel = [
    cibleRentab ? `Cible ${cibleRentab}%` : null,
    deductionPct ? `-${deductionPct}% palettes` : null,
  ].filter(Boolean).join(" + ");

  // Calcul bon original
  let totalHT = 0;
  const lignes = catsAffichees.map(cat => {
    const qty = qties[cat.id] || 0;
    const tarif = fournisseur?.tarifs?.[cat.id] || 0;
    const montant = qty * tarif;
    totalHT += montant;
    return { cat, qty, tarif, montant };
  });
  const tva = totalHT * 0.20;
  const totalTTC = totalHT + tva;

  const rentabOriginal = calcRentab(qties);

  // Tableau bon
  function TableauBon({ q, ht }) {
    const lignesBon = catsAffichees.map(cat => ({
      cat, qty: q[cat.id]||0,
      tarif: fournisseur?.tarifs?.[cat.id]||0,
      montant: (q[cat.id]||0)*(fournisseur?.tarifs?.[cat.id]||0),
    }));
    const totalBon = lignesBon.reduce((a,l)=>a+l.montant,0);
    return (
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12, marginBottom:8 }}>
        <thead>
          <tr style={{ background:"#f8fafc" }}>
            <th style={{ padding:"6px 8px", textAlign:"left", color:"#64748b", fontWeight:700 }}>Catégorie</th>
            <th style={{ padding:"6px 8px", textAlign:"center", color:"#64748b", fontWeight:700 }}>Qté</th>
            <th style={{ padding:"6px 8px", textAlign:"right", color:"#64748b", fontWeight:700 }}>Tarif HT</th>
            <th style={{ padding:"6px 8px", textAlign:"right", color:"#64748b", fontWeight:700 }}>Montant</th>
          </tr>
        </thead>
        <tbody>
          {lignesBon.map(({cat,qty,tarif,montant})=>(
            <tr key={cat.id} style={{ borderBottom:"1px solid #f1f5f9", background: qOptim && (q[cat.id]||0)!==(qties[cat.id]||0) ? "#fffbeb" : "transparent" }}>
              <td style={{ padding:"5px 8px", color:"#334155", fontSize:11 }}>{cat.dim} <span style={{color:cat.etat==="Bon état"?"#16a34a":"#ef4444",fontSize:10}}>{cat.etat}</span></td>
              <td style={{ padding:"5px 8px", textAlign:"center", fontWeight:700 }}>{qty}</td>
              <td style={{ padding:"5px 8px", textAlign:"right", color:"#64748b" }}>{tarif.toFixed(2)}€</td>
              <td style={{ padding:"5px 8px", textAlign:"right", fontWeight:700 }}>{montant.toFixed(2)}€</td>
            </tr>
          ))}
          <tr style={{ background:"#f8fafc", fontWeight:800 }}>
            <td colSpan={3} style={{ padding:"7px 8px", color:"#1e3a5f" }}>Total HT</td>
            <td style={{ padding:"7px 8px", textAlign:"right", color:"#1e3a5f" }}>{totalBon.toFixed(2)}€</td>
          </tr>
        </tbody>
      </table>
    );
  }

  function BadgeRentab({ taux }) {
    const c = taux >= 70 ? "#16a34a" : taux >= 60 ? "#f59e0b" : "#ef4444";
    return (

        const profit = caTotal - totalCouts;
        const margeColor = marge >= 70 ? "#16a34a" : marge >= 60 ? "#f59e0b" : "#ef4444";

// VUE COMPTABLE — CATÉGORIES
// ============================================================
function VueCategories({ categories, setCategories }) {
  const [form, setForm] = useState({ dim: "" });
  const [added, setAdded] = useState(null);
  const dims = [...new Set(categories.map(c => c.dim))];

  function handleAdd() {
    if (!form.dim.trim()) return;
    const dim = form.dim.trim();
    const idBon = dim.replace(/[^a-zA-Z0-9]/g, "_") + "_BON";
    const idCas = dim.replace(/[^a-zA-Z0-9]/g, "_") + "_CAS";
    if (categories.find(c => c.id === idBon)) return alert("Cette catégorie existe déjà.");
    // Crée automatiquement Bon état ET Cassée
    setCategories(prev => [
      ...prev,
      { id: idBon, dim, etat: "Bon état", color: "#22c55e", custom: true },
      { id: idCas, dim, etat: "Cassée",   color: "#ef4444", custom: true },
    ]);
    setAdded(dim);
    setForm({ dim: "" });
    setTimeout(() => setAdded(null), 3000);
  }

  function handleDelete(id) {
    setCategories(prev => prev.filter(c => c.id !== id));
  }

  return (
    <div>
      <h2 style={{ color: "#1e3a5f", marginBottom: 4 }}>Catégories de palettes</h2>
      <p style={{ color: "#94a3b8", fontSize: 14, marginBottom: 24 }}>Gérez les dimensions et états utilisés dans le tri.</p>

      <Card style={{ marginBottom: 24 }}>
        <p style={{ fontSize: 13, color: "#64748b", marginBottom: 12 }}>
          Saisissez la dimension — les catégories <strong>Bon état</strong> et <strong>Cassée</strong> seront créées automatiquement. La catégorie sera <strong>inactive par défaut</strong> dans les fiches fournisseurs.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, alignItems: "flex-end" }}>
          <div>
            <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 6, letterSpacing: 1, textTransform: "uppercase" }}>Dimension</label>
            <input
              type="text"
              value={form.dim}
              onChange={e => setForm({ dim: e.target.value })}
              onKeyDown={e => e.key === "Enter" && handleAdd()}
              placeholder="ex: 100x140, 110x130..."
              style={{
                width: "100%", boxSizing: "border-box",
                border: "2px solid #e2e8f0", borderRadius: 10,
                padding: "12px 14px", fontSize: 15,
                fontFamily: "inherit", color: "#1e3a5f",
              }}
            />
          </div>
          <Btn onClick={handleAdd} style={{ padding: "12px 20px" }}>+ Ajouter</Btn>
        </div>
        {added && (
          <div style={{ marginTop: 10, color: "#16a34a", fontWeight: 700, fontSize: 13 }}>
            ✅ "{added}" créée (Bon état + Cassée) — inactive dans les fournisseurs par défaut
          </div>
        )}
      </Card>

      {dims.map(dim => (
        <div key={dim} style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 800, color: "#1e3a5f", fontSize: 15, marginBottom: 8 }}>{dim}</div>
          <div style={{ display: "grid", gap: 8 }}>
            {categories.filter(c => c.dim === dim).map(cat => (
              <Card key={cat.id} style={{ padding: "12px 18px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 10, height: 10, borderRadius: "50%", background: cat.color }} />
                  <span style={{ fontSize: 14, color: "#334155" }}>{cat.etat}</span>
                </div>
                <Btn small color="#ef4444" outline onClick={() => handleDelete(cat.id)}>Supprimer</Btn>
              </Card>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// Composant input prix avec état local (évite le useState dans .map())
// ============================================================
// VUE RAPPORTS
// ============================================================
function VueRapports({ enlevements, fournisseurs, categories }) {
  const now = new Date();
  const MOIS_NOMS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const [fournisseurId, setFournisseurId] = useState("tous");
  const [periode, setPeriode] = useState("mensuel");
  const [annee, setAnnee] = useState(now.getFullYear());
  const [trimestre, setTrimestre] = useState(Math.floor(now.getMonth()/3)+1);
  const [semestre, setSemestre] = useState(now.getMonth()<6?1:2);
  const [mois, setMois] = useState(now.getMonth());
  const [emailEnvoye, setEmailEnvoye] = useState(null);

  function getPlageDates() {
    if (periode==="mensuel") {
      const debut=`${annee}-${String(mois+1).padStart(2,"0")}-01`;
      const fin=`${annee}-${String(mois+1).padStart(2,"0")}-${new Date(annee,mois+1,0).getDate()}`;
      return { debut, fin, label:`${MOIS_NOMS[mois]} ${annee}` };
    }
    if (periode==="trimestriel") {
      const md=(trimestre-1)*3, mf=md+2;
      return { debut:`${annee}-${String(md+1).padStart(2,"0")}-01`, fin:`${annee}-${String(mf+1).padStart(2,"0")}-${new Date(annee,mf+1,0).getDate()}`, label:`T${trimestre} ${annee}` };
    }
    if (periode==="semestriel") {
      const md=(semestre-1)*6, mf=md+5;
      return { debut:`${annee}-${String(md+1).padStart(2,"0")}-01`, fin:`${annee}-${String(mf+1).padStart(2,"0")}-${new Date(annee,mf+1,0).getDate()}`, label:`S${semestre} ${annee}` };
    }
    return { debut:`${annee}-01-01`, fin:`${annee}-12-31`, label:`Année ${annee}` };
  }

  const { debut, fin, label } = getPlageDates();

  const bonsFiltres = enlevements.filter(e =>
    e.bonEnvoye && e.date>=debut && e.date<=fin &&
    (fournisseurId==="tous" || e.fournisseurId===fournisseurId)
  );

  const parFournisseur = {};
  bonsFiltres.forEach(e => {
    if (!parFournisseur[e.fournisseurId]) parFournisseur[e.fournisseurId]=[];
    parFournisseur[e.fournisseurId].push(e);
  });

  function calcMontant(enl) {
    const f = fournisseurs.find(f=>f.id===enl.fournisseurId);
    const qties = enl.quantitesValidees||enl.quantitesTri||{};
    let ht=0;
    Object.entries(qties).forEach(([catId,qty])=>{ ht+=(qty||0)*(f?.tarifs?.[catId]||0); });
    return { ht, ttc:ht*1.20, nbPalettes:Object.values(qties).reduce((a,b)=>a+(b||0),0) };
  }

  function genererTexte(fId, bons) {
    const f = fournisseurs.find(f=>f.id===fId);
    let totalHT=0, totalPal=0;
    const lignes = bons.map(e=>{
      const {ht,ttc,nbPalettes}=calcMontant(e);
      totalHT+=ht; totalPal+=nbPalettes;
      return `  - ${formatDate(e.date)} : ${nbPalettes} palettes — ${ht.toFixed(2)}€ HT (${ttc.toFixed(2)}€ TTC)`;
    }).join("\n");

// ============================================================
function PrixInput({ value, onSave }) {
  const [local, setLocal] = useState(value > 0 ? value.toFixed(2).replace(".", ",") : "");
  useEffect(() => {
    setLocal(value > 0 ? value.toFixed(2).replace(".", ",") : "");
  }, [value]);
  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        value={local}
        onChange={e => setLocal(e.target.value)}
        onBlur={() => {
          const val = parseFloat(local.replace(",", "."));
          if (!isNaN(val) && val > 0) {
            setLocal(val.toFixed(2).replace(".", ","));
            onSave(val);
          }
        }}
        placeholder="ex: 8,00"
        style={{ width: "100%", boxSizing: "border-box", border: "2px solid #bbf7d0", borderRadius: 8, padding: "10px 48px 10px 14px", fontSize: 15, fontFamily: "inherit" }}
      />
      <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "#94a3b8", fontWeight: 700 }}>€ HT</span>
    </div>
  );
}
